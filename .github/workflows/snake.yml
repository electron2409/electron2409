## 🚀 Featured Projects

### 🤖 [Humanoid Motion Retargeting](https://github.com/electron2409/Dl-Hack-60)

Live webcam video drives a **Unitree G1** humanoid in a MuJoCo simulation. ROMP estimates 3D body pose and General Motion Retargeting (inverse kinematics) maps it onto the robot's joints.

- Cut network-camera lag from seconds to near zero with threaded latest-frame capture
- Fixed violent jitter by smoothing final robot joint angles instead of raw axis-angles
- Full write-up of the bugs and lessons in the repo

`Python` `PyTorch` `OpenCV` `MuJoCo` `ROMP`

<br/>

### 💳 [AIHack India 2026: Credit Risk](https://github.com/electron2409/AiHack)

Predicts customer loan default with a gradient-boosted ensemble, built over **seven iterations** of feature engineering and stacking.

- **0.7541** out-of-fold AUC (5-fold CV)
- Cross-fitted greedy blend of XGBoost and CatBoost, selected per fold to avoid bias
- Fixed fold split, unit tests and per-version reports

`Python` `XGBoost` `CatBoost` `Stacking`

